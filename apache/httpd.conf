ServerRoot "/home/runner/workspace/apache"
PidFile /home/runner/workspace/apache/run/httpd.pid

LoadModule mpm_event_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_mpm_event.so
LoadModule authn_core_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_authn_core.so
LoadModule authz_core_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_authz_core.so
LoadModule dir_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_dir.so
LoadModule mime_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_mime.so
LoadModule log_config_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_log_config.so
LoadModule unixd_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_unixd.so
LoadModule proxy_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_proxy.so
LoadModule proxy_fcgi_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_proxy_fcgi.so
LoadModule setenvif_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_setenvif.so
LoadModule rewrite_module /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/modules/mod_rewrite.so

User runner
Group runner

Listen 5000

ServerName localhost
ServerAdmin webmaster@localhost

DocumentRoot "/home/runner/workspace"

<Directory "/home/runner/workspace">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.php index.html

TypesConfig /nix/store/bigv3q6fiqcf6nd4zhdr8h4jkfjylwmx-apache-httpd-2.4.62/conf/mime.types

<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:9000"
</FilesMatch>

ErrorLog /home/runner/workspace/apache/logs/error_log
CustomLog /home/runner/workspace/apache/logs/access_log combined

LogLevel warn
