[global]
pid = /home/runner/workspace/apache/run/php-fpm.pid
error_log = /home/runner/workspace/apache/logs/php-fpm.log
daemonize = no

[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

php_admin_value[error_log] = /home/runner/workspace/apache/logs/php-errors.log
php_admin_flag[log_errors] = on
